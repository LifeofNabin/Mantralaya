<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us</title>
  <link rel="stylesheet" href="css/nav.css" />
  <link rel="stylesheet" href="css/contact.css" />
  <script src="js/include.js" defer></script>
</head>
<body>

  <!-- ✅ Shared Navbar -->
  <div data-include="navbar/nav.html"></div>

  <!-- ✅ Contact Section -->
  <section class="contact-section">
    <h2>Contact Us</h2>
    <p class="intro">We'd love to hear from you. Please fill out the form below.</p>

    <form class="contact-form" action="http://localhost:3000/api/contact" method="POST" enctype="multipart/form-data">
      <div class="form-group">
        <label for="name">Name</label>
        <input type="text" name="name" id="name" required placeholder="Your Full Name" />
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" name="email" id="email" required placeholder="you@example.com" />
      </div>

      <div class="form-group">
        <label for="message">Message</label>
        <textarea name="message" id="message" rows="5" placeholder="Your message here..."></textarea>
      </div>

      <div class="form-group">
        <label for="resume">Upload Resume</label>
        <input type="file" name="resume" id="resume" accept=".pdf,.doc,.docx" />
      </div>

      <button type="submit" class="btn">Send Message</button>
    </form>
  </section>

</body>
</html>
